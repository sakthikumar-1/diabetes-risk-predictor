{% extends "base.html" %}

{% block title %}404 - Not Found | Diabetes Risk Predictor{% endblock %}

{% block content %}
<div class="card" style="max-width: 620px; margin: 4rem auto; text-align: center; padding: 3.5rem 2rem;">
  <div style="width: 80px; height: 80px; border-radius: 50%; background: rgba(0, 242, 254, 0.1); color: var(--neon-cyan); border: 1.5px solid rgba(0, 242, 254, 0.3); display: flex; align-items: center; justify-content: center; font-size: 2.25rem; margin: 0 auto 1.5rem; box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);">
    <i class="fas fa-radar"></i>
  </div>
  <div class="eyebrow" style="margin: 0 auto 0.75rem;">Status 404</div>
  <h1 style="font-size: 2.25rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.03em;">
    Route Not Found
  </h1>
  <p style="color: var(--text-secondary); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem;">
    The requested endpoint or record does not exist or was moved during the current session.
  </p>
  <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
    <a class="btn btn-primary btn-lg" href="{{ url_for('index') }}">
      <i class="fas fa-home"></i> Return to Overview
    </a>
    <a class="btn btn-secondary btn-lg" href="{{ url_for('assessment') }}">
      <i class="fas fa-bolt"></i> Start Assessment
    </a>
  </div>
</div>
{% endblock %}
